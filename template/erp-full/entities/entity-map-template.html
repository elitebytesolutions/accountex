<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finsoft Entity Map</title>
<style>
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface-2:#F7F8F5;--line:#E7EAE5;--ink:#0F1A14;--muted:#6B746E;
  --primary:#1F5F45;--primary-soft:#E6F0EA;--lime:#C6E85B;--on-lime:#0F1A14;
  --warn:#B45309;--warn-soft:#FDF1E1;--grey:#9AA39D;--grey-soft:#EEF0EC;--sim:#7A5300;--sim-soft:#FFF3CF;
  --shadow:0 1px 2px rgba(15,26,20,.05),0 10px 30px rgba(15,26,20,.07);
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F0D;--surface:#111815;--surface-2:#161F1B;--line:#212C27;--ink:#E8EFEA;--muted:#8A978F;
    --primary:#3DD39B;--primary-soft:#12291F;--lime:#C6E85B;--on-lime:#0F1A14;
    --warn:#F59E0B;--warn-soft:#2A1F0C;--grey:#5E6B64;--grey-soft:#1A231F;--sim:#F5C451;--sim-soft:#2B2410;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F0D;--surface:#111815;--surface-2:#161F1B;--line:#212C27;--ink:#E8EFEA;--muted:#8A978F;
  --primary:#3DD39B;--primary-soft:#12291F;--lime:#C6E85B;--on-lime:#0F1A14;
  --warn:#F59E0B;--warn-soft:#2A1F0C;--grey:#5E6B64;--grey-soft:#1A231F;--sim:#F5C451;--sim-soft:#2B2410;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.mono{font-family:var(--mono)}
code{font:11.5px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;overflow-wrap:anywhere}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:40;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
:root[data-theme="dark"] .logo{color:#0A0F0D}
.brand h1{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-1px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.06em;background:var(--lime);color:var(--on-lime)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.stat.w b{color:var(--warn)}
.spacer{flex:1}
.btn{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.sm{height:28px;border-radius:9px;font-size:12px;padding:0 9px}
.btn.sm.icon{width:28px;padding:0}
.menu{display:none}
.tabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px}
.tab{height:30px;padding:0 13px;border-radius:10px;border:0;background:none;font-weight:650;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,26,20,.08),0 0 0 1px var(--line)}

/* layout */
.wrap{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
.rail{width:340px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.rail-head{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{width:100%;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 30px 0 34px;outline:none}
.search input:focus{border-color:var(--primary);background:var(--surface)}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.search kbd{position:absolute;right:9px;top:9px;font:600 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:650;color:var(--muted);max-width:100%}
.fchip:hover{border-color:var(--primary)}
.fchip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
select.fchip{max-width:150px;cursor:pointer;padding-right:6px}
.rcount{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.rcount button{border:0;background:none;color:var(--primary);font-weight:650;padding:0;font-size:11.5px}
.rail-list{flex:1;overflow:auto;padding:4px 8px 28px;scrollbar-width:thin}
.pg{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:14px 8px 2px;display:flex;justify-content:space-between}
.mg{font-size:12px;font-weight:750;padding:9px 8px 3px;display:flex;gap:7px;align-items:center}
.mg i{width:8px;height:8px;border-radius:50%;flex:none}
.mg span{color:var(--muted);font-weight:500;margin-left:auto;font-size:11px}
a.row{display:block;padding:7px 10px;border-radius:12px;text-decoration:none;color:inherit;border:1px solid transparent;margin:1px 0}
a.row:hover{background:var(--surface-2)}
a.row.act{background:var(--primary-soft);border-color:var(--primary)}
.row .t1{display:flex;gap:8px;align-items:center}
.row .tt{font-weight:650;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .rt{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.row .why{font-size:11px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.dots{display:inline-flex;gap:3px}
.dots b{width:6px;height:6px;border-radius:50%;display:inline-block}
.dots .a{background:var(--warn)}.dots .p{background:var(--primary)}.dots .s{background:var(--sim)}
.row .bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.row .bar i{display:block;height:100%;background:var(--primary)}
.scrim{display:none;position:absolute;inset:0;background:rgba(10,15,13,.35);z-index:25}
.main{flex:1;min-width:0;overflow:auto;padding:22px 28px 70px;scroll-behavior:auto}
.inner{max-width:1180px;margin:0 auto}

/* screen detail */
.crumbs{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs i{width:8px;height:8px;border-radius:50%;display:inline-block}
h2.ttl{margin:4px 0 6px;font-size:26px;font-weight:780;letter-spacing:-.025em;line-height:1.15}
.rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.route{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px}
.route button{border:0;background:var(--surface-2);border-radius:7px;width:24px;height:22px;display:grid;place-items:center;color:var(--muted)}
.route button:hover{color:var(--primary)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:750;letter-spacing:.03em;white-space:nowrap;vertical-align:1px;border:1px solid transparent}
.tag.sim{background:var(--sim-soft);color:var(--sim)}
.tag.appr{background:var(--warn-soft);color:var(--warn)}
.tag.post{background:var(--primary-soft);color:var(--primary)}
.tag.full{background:var(--grey-soft);color:var(--muted);border-color:var(--line)}
.tag.view{background:var(--grey-soft);color:var(--muted)}
.tag.ghost{background:var(--surface);border-color:var(--line);color:var(--muted)}
.src{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.src code{font-size:11px}
.purpose{margin:12px 0 0;font-size:14.5px;line-height:1.55;max-width:860px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:14px;min-width:0}
.card>h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .n{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:10.5px;letter-spacing:0;color:var(--ink)}
.card>h3 .right{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.grid2>.card{margin-top:14px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role h4{margin:0 0 7px;font-size:11.5px;font-weight:750;color:var(--muted);display:flex;gap:6px;align-items:center}
.role h4 b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:600 11.5px var(--mono);color:var(--ink);cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.tchip:hover{border-color:var(--primary);color:var(--primary)}
.tchip i{width:8px;height:8px;border-radius:50%;flex:none}
.tchip.view{border-style:dashed}
.tchip.full{opacity:.55;border-style:dashed}
.tchip.missing{border-color:var(--warn);color:var(--warn)}
.none{color:var(--muted);font-size:12px;font-style:italic}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.legend span{display:inline-flex;gap:4px;align-items:center}

/* field table */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.fm{width:100%;border-collapse:collapse;font-size:12.5px}
table.fm th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.fm td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
table.fm tr:last-child td{border-bottom:0}
table.fm tr:hover td{background:var(--surface-2)}
table.fm td.ui{font-weight:600;width:30%;min-width:160px}
table.fm td.nt{color:var(--muted);width:26%;min-width:140px;font-size:12px}
table.fm td.mp{min-width:220px}
table.fm td.sd{width:14px;padding-right:0}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--grey-soft);border:1px solid var(--grey)}
.sdot.ok{background:var(--primary);border-color:var(--primary)}
.sdot.warn{background:var(--warn);border-color:var(--warn)}
.ref{display:inline-flex;align-items:center;gap:5px;padding:0 7px 0 2px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font:11.5px/1.65 var(--mono);color:var(--ink);cursor:pointer;margin:1px 0;max-width:100%;overflow-wrap:anywhere;text-align:left;vertical-align:middle}
.ref:hover{border-color:var(--primary)}
.ref .ic{width:15px;height:15px;border-radius:5px;display:inline-grid;place-items:center;font:800 9.5px/1 'Segoe UI',system-ui,sans-serif;flex:none}
.ref.ok .ic{background:var(--primary);color:var(--surface)}
.ref.warn{border-color:var(--warn);background:var(--warn-soft)}
.ref.warn .ic{background:var(--warn);color:#fff}
.ref.grey{color:var(--muted)}
.ref.grey .ic{background:transparent;color:var(--muted);border:1px dashed var(--grey)}
.ref.full{opacity:.6}
.ref.pt{box-shadow:inset 0 0 0 1px var(--primary)}
.ref.hl{outline:2px solid var(--lime);outline-offset:1px}
.ref small{font:700 9px 'Segoe UI',system-ui,sans-serif;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.cx{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.lkp{display:inline-flex;align-items:center;gap:4px;padding:0 7px 0 2px;margin:1px 0 1px 4px;border-radius:7px;border:1px solid #EBCB6B;background:#FFF8E1;color:#7A5300;font:600 11px/1.65 var(--mono);cursor:pointer;vertical-align:middle;white-space:nowrap}
.lkp span{font:800 8.5px/1 'Segoe UI',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;background:#EBCB6B;color:#4A3300;border-radius:5px;padding:3px 4px}
.lkp em{font-style:normal;color:var(--muted);font-weight:500}
.lkp:hover{border-color:var(--primary)}
.lkp.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.lkp.sm{margin:3px 0 0;font-size:10.5px}
:root[data-theme="dark"] .lkp{background:#2B2410;color:#F5C451;border-color:#5C4A12}
:root[data-theme="dark"] .lkp span{background:#5C4A12;color:#F5C451}
.tone{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.fgrp{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.fgrp:last-child{border-bottom:0}
.fgrp .fent{flex-basis:100%}
.fi{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}
.fl{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fnc{display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 2px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font:600 11.5px/1.65 var(--mono);color:var(--ink);cursor:pointer}
.fnc .ic{width:15px;height:15px;border-radius:5px;display:inline-grid;place-items:center;font:800 10px/1 Georgia,serif;flex:none;background:var(--primary-soft);color:var(--primary)}
.fnc:hover{border-color:var(--primary)}
.fnc.warn{border-color:var(--warn);background:var(--warn-soft)}
.fnc.warn .ic{background:var(--warn);color:#fff;font-family:'Segoe UI',system-ui,sans-serif}
.lkrows{display:flex;flex-direction:column;gap:4px}
.lkrow{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:3px 0;border-bottom:1px dashed var(--line)}
.lkrow:last-child{border-bottom:0}
.lkrow .arr{color:var(--muted);margin:0 4px;font-weight:700}
.unk{border-bottom:1px dotted var(--muted);color:var(--muted)}

/* statuses / actions */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.flow:last-child{border-bottom:0}
.st{display:inline-block;padding:2px 9px;border-radius:999px;border:1.5px solid var(--primary);color:var(--primary);background:var(--primary-soft);font:700 11px/1.5 var(--mono)}
.st.d{border-style:dashed;background:transparent;color:var(--muted);border-color:var(--grey)}
.fa{color:var(--muted);font-weight:700}
.ft{color:var(--muted);font-size:12px}
ul.acts{list-style:none;margin:0;padding:0}
ul.acts li{padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface-2);font-size:12.5px;line-height:1.6}
ul.acts li.post{border-left:3px solid var(--primary)}
ul.acts li b{font-weight:700}
ul.acts .arr{color:var(--muted);margin:0 6px}
.perm{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font:600 11.5px var(--mono);padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0}
.kv>span{font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.extra{font-size:12.5px;line-height:1.6;margin-bottom:8px}
.extra b.l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
pre.raw{white-space:pre-wrap;word-break:break-word;font:11.5px/1.55 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;max-height:70vh;overflow:auto}
table.gt{border-collapse:collapse;font-size:12px;width:100%}
table.gt th,table.gt td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.gt th{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}

/* reverse view + coverage */
.hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hd .grow{flex:1;min-width:240px}
.desc{white-space:pre-wrap;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;margin-top:10px;max-width:900px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:650}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
a.scard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--surface-2)}
a.scard:hover{border-color:var(--primary)}
a.scard b{display:block;font-size:12.5px}
a.scard small{font:11px var(--mono);color:var(--muted)}
table.cm{width:100%;border-collapse:collapse;font-size:12px}
table.cm th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cm td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.cm td.n{font:600 12px var(--mono);white-space:nowrap}
table.cm td.n small{display:block;font:400 10.5px var(--mono);color:var(--muted);white-space:normal;max-width:220px}
table.cm tr.un td.n{color:var(--warn)}
table.cm tr.sys td{opacity:.55}
table.cm tr.hl td{background:var(--primary-soft)}
a.mini{display:inline-block;text-decoration:none;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface-2);margin:1px 2px 1px 0;white-space:nowrap}
a.mini:hover{border-color:var(--primary);color:var(--primary)}
a.mini.e{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--primary)}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750}
.kpi b{display:block;font-size:26px;font-weight:780;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:14px;color:var(--muted);font-weight:600}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.w b{color:var(--warn)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--primary);border-radius:6px}
.meter.l i{background:var(--lime)}
.bars{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:6px 8px;border-radius:10px;text-decoration:none;color:inherit;font-size:12.5px}
.brow:hover{background:var(--surface-2)}
.brow .lb{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:7px;align-items:center}
.brow .lb i{width:8px;height:8px;border-radius:50%;flex:none}
.brow .vl{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .meter{margin:0;height:8px}
ul.lst{list-style:none;margin:0;padding:0}
ul.lst li{padding:7px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface-2);font-size:12px;word-break:break-word}
ul.lst li small{color:var(--muted);display:block}
.ulist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ulist .cnum{font:700 11px var(--mono);color:var(--warn);min-width:26px}
.wrapchips{display:flex;flex-wrap:wrap;gap:5px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.empty{display:grid;place-items:center;min-height:50vh;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:10px 0 4px}
.debug{border-color:var(--warn)}
.debug pre{white-space:pre-wrap;font:11px/1.5 var(--mono);margin:0;max-height:60vh;overflow:auto}

/* drawer */
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:470px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  transform:translateX(calc(100% + 24px));transition:transform .22s ease;display:flex;flex-direction:column;z-index:35;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh .t{flex:1;min-width:0}
.dh .sch{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dh .sch i{width:8px;height:8px;border-radius:50%}
.dh h3{margin:2px 0 0;font-size:18px;font-weight:750;word-break:break-word}
.db{overflow:auto;padding:4px 18px 18px;flex:1}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.sec h4 span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:10.5px;letter-spacing:0}
table.cols{width:100%;border-collapse:collapse;font-size:12px}
table.cols th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:-4px;background:var(--surface)}
table.cols td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cols td.n{font-weight:600;overflow-wrap:anywhere}
table.cols td.n small{display:block;font-weight:400;color:var(--muted)}
table.cols td.ty{color:var(--muted);font-family:var(--mono);font-size:11px;word-break:break-word}
table.cols tr.here td{background:var(--primary-soft)}
table.cols tr.focus td{background:var(--lime);color:var(--on-lime)}
.k{display:inline-block;font-size:9.5px;font-weight:800;padding:0 4px;border-radius:5px;margin-right:4px;vertical-align:1px}
.k.pk{background:var(--lime);color:var(--on-lime)}
.k.fk{background:var(--primary-soft);color:var(--primary)}
.k.uq{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.nn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary)}
.dbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* tooltip, toast */
.tip{position:fixed;z-index:200;max-width:min(380px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;pointer-events:none;display:none;box-shadow:var(--shadow);line-height:1.5}
.tip b{font-family:var(--mono);font-size:12px}
.tip .tl{color:var(--muted);font-size:11px}
.tip .tc{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-word}
.tip .w{color:var(--warn);font-weight:650}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:1100px){
  .roles{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .stats .stat:nth-child(n+3){display:none}
}
@media (max-width:860px){
  .stats{display:none}
  .menu{display:inline-flex}
  .top{gap:8px;padding:8px 12px}
  .rail{position:absolute;left:0;top:0;bottom:0;width:min(340px,88vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow);visibility:hidden}
  .rail.open{transform:none;visibility:visible}
  .scrim.show{display:block}
  .main{padding:16px 16px 70px}
  .brand small{display:none}
  h2.ttl{font-size:22px}
}
@media (max-width:720px){
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;height:74vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
  .drawer::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  .brow{grid-template-columns:minmax(0,1fr) 92px;}
  .brow .meter{grid-column:1 / -1;order:3}
}
@media (max-width:600px){
  .tabs{order:5;width:100%}
  .tab{flex:1;padding:0 6px}
  .brand h1{font-size:14px}
  .card{padding:14px 14px;border-radius:16px}
  .tw{margin:0 -14px;padding:0 14px}
  table.fm thead{display:none}
  table.fm,table.fm tbody,table.fm tr,table.fm td{display:block;width:auto !important;min-width:0 !important}
  table.fm tr{border-bottom:1px solid var(--line);padding:8px 0}
  table.fm tr:last-child{border-bottom:0}
  table.fm td{border:0;padding:2px 0}
  table.fm td.sd{display:none}
  table.fm td.nt:empty{display:none}
  table.fm td.mp::before,table.fm td.nt::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750}
  table.cm th:nth-child(4),table.cm td:nth-child(4){display:none}
  .kv{grid-template-columns:1fr;gap:2px}
}

   ====================================================================== */

  if (desc) h += '<div class="sec"><div class="desc">' + esc(desc) + '</div></div>';
  if (k === 'full') h += '<div class="sec"><div class="desc">Full-edition only. This table is not part of the ' + EDITION + ' DDL.</div></div>';
  if (k === 'none') h += '<div class="sec"><div class="desc" style="border-color:var(--warn)">Not in this edition’s DDL (no CREATE TABLE / VIEW). Check the name in the doc.</div></div>';
  h += '<div class="dbtns"><a class="btn sm" href="#table=' + esc(id) + (col ? '&col=' + esc(col) : '') + '">Entity → Screens</a>' +
    (k === 'table' || k === 'view' ? '<a class="btn sm" href="../erd/index.html#table=' + esc(id) + '" target="_blank" rel="noopener">Open in ERD ↗</a>' : '') + '</div>';
  if (t) {

    if (tf.length) h += '<div class="sec"><h4>API functions <span>' + tf.length + '</span></h4><div class="fgrp">' + tf.map(function (f) { return fnChip(f.id); }).join('') + '</div></div>';
    h += '<div class="sec"><h4>Columns <span>' + t.cols.length + '</span>' + (Object.keys(here).length ? '<span>' + Object.keys(here).length + ' on this screen</span>' : '') + '</h4><table class="cols"><thead><tr><th>Name</th><th>Type</th><th title="NOT NULL">NN</th><th>Default</th></tr></thead><tbody>';
    t.cols.forEach(function (c) {
      var tags = (c.pk ? '<span class="k pk">PK</span>' : '') + (c.fks.length ? '<span class="k fk">FK</span>' : '') + (c.unique ? '<span class="k uq">UQ</span>' : '');
      var note = c.comment || c.note || '', px = pfx(col), foc = c.name === focusName;
      h += '<tr class="' + (foc || (px && c.name.toLowerCase().indexOf(px.toLowerCase()) === 0) ? 'focus' : here[c.name] ? 'here' : '') + '"' + (foc ? ' id="dFocus"' : '') + '><td class="n">' + tags + esc(c.name) + (note ? '<small>' + esc(note) + '</small>' : '') +
        (c.fks.length ? '<small>→ ' + c.fks.map(function (fk) { return esc(fk.to); }).join(', ') + '</small>' : '') + '</td><td class="ty">' + esc(c.type) +
        (c.lookup ? '<button class="lkp sm" data-lookup="' + esc(c.lookup.type) + '" title="Values from list ' + esc(c.lookup.type) + '"><span>list</span>' + esc(c.lookup.type) + '</button>' : '') +
        (c.gen ? '<div>GENERATED ' + esc(c.gen) + '</div>' : '') +
        (c.checks.length ? '<div title="CHECK">' + esc(c.checks.join(' · ')).slice(0, 220) + '</div>' : '') + '</td><td>' + (c.notNull ? '<span class="nn" title="NOT NULL"></span>' : '') + '</td><td class="ty">' + esc(c.def == null ? '' : c.def) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (col && !colOf(id, col) && !pfx(col)) {

      h = '<div class="sec"><div class="desc" style="border-color:var(--warn)">Column <b class="mono">' + esc(col) + '</b> is not in <span class="mono">' + esc(id) + '</span>.' + (sg ? ' Closest: <b class="mono">' + esc(sg) + '</b>.' : '') + '</div></div>' + h;
    }
  } else if (v) {
    h += '<div class="sec"><h4>Reads</h4>' + ((v.reads || []).length ? '<div class="chips">' + v.reads.map(function (r) { return tableChip(r); }).join('') + '</div>' : '<div class="none">—</div>') + '</div>';
    if (col) h += '<div class="sec"><div class="desc">Column <b class="mono">' + esc(col) + '</b> ' + (viewHas(id, col) ? 'appears in the view SQL.' : 'was <b>not found</b> in the view SQL.') + '</div></div>';
  }
  var groups = screensUsing(id), n = 0;
  var sh = groups.map(function (g) { if (!g[1].length) return ''; n += g[1].length; return '<div style="margin-bottom:8px"><div class="hint" style="margin:0 0 4px;font-weight:700">' + g[0] + '</div><ul class="lst">' + g[1].map(function (s) { return '<li><a class="lnk" href="#screen=' + esc(s.route) + '"><b>' + esc(s.title) + '</b></a><small class="mono">' + esc(s.route) + '</small></li>'; }).join('') + '</ul></div>'; }).join('');
  h += '<div class="sec"><h4>Used by screens <span>' + n + '</span></h4>' + (sh || '<div class="none">No screen.</div>') + '</div>';
  $('dBody').innerHTML = h;
  $('dBody').scrollTop = 0;
  $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false');
  var f = $('dFocus'); if (f) scrollWithin($('dBody'), f);
}
function openLookup(ty) {
  if (!M.lookups[ty]) { var l = String(ty).toLowerCase(); M.lookupTypes.forEach(function (x) { if (x.toLowerCase() === l) ty = x; }); }
  var vals = M.lookups[ty] || [], use = M.lookupUse[ty] || [];

  var hasParent = vals.some(function (v) { return v.parentCodes && v.parentCodes.length; });

    (use.some(function (u) { return u.allowTenant; }) ? '<span class="chip">tenants may add values</span>' : '') + (deps.length ? '<span class="chip">depends on <b>' + esc(deps.join(', ')) + '</b></span>' : '') + '</div>';
  h += '<div class="sec"><h4>Values <span>' + vals.length + '</span></h4>' + (vals.length ? '<table class="cols lv"><thead><tr><th>Code</th><th>Label</th><th>Tone</th>' + (hasParent ? '<th>Parent codes</th>' : '') + '</tr></thead><tbody>' +
    vals.map(function (v) {
      return '<tr><td class="n mono">' + esc(v.code) + '</td><td>' + esc(v.label) + '</td><td><span class="tone" style="background:' + toneColor(v.tone) + '"></span>' + esc(v.tone) + '</td>' +

    }).join('') + '</tbody></table>' : '<div class="none">No values for this list in 92-lookups.sql.</div>') + '</div>';
  h += '<div class="sec"><h4>Used by columns <span>' + use.length + '</span></h4>' + (use.length ? '<div class="chips">' + use.map(function (u) {
    return '<button class="tchip" data-t="' + esc(u.table) + '" data-c="' + esc(u.column) + '"><i style="background:' + modColor(modOf(u.table)) + '"></i>' + esc(u.table + '.' + u.column) + '</button>';
  }).join('') + '</div>' : '<div class="none">No registered column.</div>') + '</div>';

  $('dBody').scrollTop = 0;

}
function closeDrawer() { $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); }

/* ======================================================================
   Global clicks, tooltip, keyboard
   ====================================================================== */
function scrollWithin(box, el) {
  if (!box || !el) return;
  box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 2 + el.offsetHeight / 2;
}
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.tm); toast.tm = setTimeout(function () { t.classList.remove('show'); }, 1400); }
function copy(text) {
  function fallback() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); toast('Copied ' + text); }
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Copied ' + text); }, fallback); else fallback(); } catch (e) { fallback(); }
}
document.addEventListener('click', function (e) {
  var c = e.target.closest('[data-copy]'); if (c) { copy(c.getAttribute('data-copy')); return; }
  var lk = e.target.closest('[data-lookup]'); if (lk) { hideTip(); openLookup(lk.getAttribute('data-lookup')); return; }
  var r = e.target.closest('.ref[data-t],.tchip[data-t],.fnc[data-t]');

  var md = e.target.closest('[data-mod]');
  if (md && md.closest('#inner')) { S.F.mod = md.getAttribute('data-mod'); if (md.tagName === 'A' && md.getAttribute('href') === '#') { e.preventDefault(); renderRail(); } return; }
  if (e.target.id === 'btnSrc') { var p = $('rawSrc'); p.hidden = !p.hidden; e.target.textContent = p.hidden ? 'Show source' : 'Hide source'; return; }
  if (e.target.id === 'btnUnmapped') { S.TF.unmapped = !S.TF.unmapped; renderTable(S.table); return; }
  if (e.target.id === 'btnAllUnres') { S.showAllUnres = true; renderCoverage(); setTimeout(function () { var u = $('unres'); if (u) $('main').scrollTop += u.getBoundingClientRect().top - $('main').getBoundingClientRect().top - 12; }, 10); return; }
  var sc = e.target.closest('[data-scroll]'); if (sc) { e.preventDefault(); var el = $(sc.getAttribute('data-scroll')); if (el) $('main').scrollTop += el.getBoundingClientRect().top - $('main').getBoundingClientRect().top - 12; return; }
  if (!e.target.closest('#drawer') && $('drawer').classList.contains('open') && !e.target.closest('.ref,.tchip')) closeDrawer();
});
$('btnMenu').onclick = function () { var o = !$('rail').classList.contains('open'); $('rail').classList.toggle('open', o); $('scrim').classList.toggle('show', o); };
$('scrim').onclick = function () { $('rail').classList.remove('open'); $('scrim').classList.remove('show'); };

var tipEl = $('tip');
function hideTip() { tipEl.style.display = 'none'; }
function colTip(id, col, st, raw, sug) {
  var t = M.tables[id], k = kindOf(id), h = '';
  if (!id) return '<b>' + esc(raw) + '</b><div class="w">Qualifier is not a known table or view.</div>';
  h += '<b>' + esc(id + (col ? '.' + col : '')) + '</b>';
  if (raw && raw !== id + (col ? '.' + col : '')) h += '<div class="tl">written as <span class="mono">' + esc(raw) + '</span></div>';
  if (k === 'full') return h + '<div class="tl">Full-edition only; not in the ' + EDITION + ' DDL.</div>';
  if (k === 'none') return h + '<div class="w">' + (st === 'noview' ? 'View not defined in the views SQL.' : 'Table not in this edition’s DDL.') + '</div>';
  if (k === 'view') return h + '<div class="tl">View' + (col ? (viewHas(id, col) ? ' column (name appears in the view SQL)' : '; column name <span class="w">not found</span> in the view SQL') : '') + '</div>' + (IDX.viewById[id].desc ? '<div class="tc">' + esc(IDX.viewById[id].desc).slice(0, 240) + '</div>' : '');
  if (!col) return h + '<div class="tl">Table · ' + t.cols.length + ' columns · ' + esc(t.file) + '</div>' + (t.comment || t.desc ? '<div class="tc">' + esc(t.comment || t.desc).slice(0, 240) + '</div>' : '');
  var px = pfx(col);
  if (px) { var gp = prefixCols(t, px).map(function (n) { return t.colMap[n]; }); if (gp.length) return h + '<div class="tl">prefix: ' + gp.length + ' columns</div><div class="tc">' + gp.map(function (x) { return esc(x.name + ' ' + x.type); }).join('<br>') + '</div>'; }
  var c = colOf(id, col);
  if (!c) return h + '<div class="w">Column not found in ' + esc(id) + ' (' + t.cols.length + ' columns).</div>' + (sug ? '<div class="tl">Closest: <span class="mono">' + esc(sug) + '</span></div>' : '');
  h += '<div><span class="mono">' + esc(c.type) + '</span> · ' + (c.notNull ? 'NOT NULL' : 'nullable') + (c.pk ? ' · PK' : '') + (c.unique ? ' · UNIQUE' : '') + '</div>';
  if (c.def != null) h += '<div class="tl">default <span class="mono">' + esc(c.def) + '</span></div>';
  if (c.gen) h += '<div class="tl">generated <span class="mono">' + esc(c.gen).slice(0, 160) + '</span></div>';
  if (c.lookup) {
    var lv = M.lookups[c.lookup.type] || [];
    h += '<div class="tl">list <span class="mono">' + esc(c.lookup.type) + '</span> · ' + lv.length + ' values' + (c.lookup.dependsOn ? ' · depends on ' + esc(c.lookup.dependsOn) : '') + '</div>' +
      '<div class="tc">' + lv.slice(0, 8).map(function (v) { return '<span class="tone" style="background:' + toneColor(v.tone) + '"></span>' + esc(v.code); }).join(' ') + (lv.length > 8 ? ' …' : '') + '</div>';
  }
  if (c.fks.length) h += '<div class="tl">FK → <span class="mono">' + c.fks.map(function (fk) { return esc(fk.to + '.' + fk.toCol); }).join(', ') + '</span></div>';
  if (c.checks.length) h += '<div class="tc">CHECK ' + esc(c.checks.join(' · ')).slice(0, 260) + '</div>';
  var tc = t.constraints.filter(function (x) { return x.kind === 'CHECK' && x.expr && new RegExp('\\b' + c.name.replace(/\W/g, '') + '\\b').test(x.expr); });
  if (tc.length) h += '<div class="tc">' + esc(tc.map(function (x) { return 'CHECK ' + x.expr; }).join(' · ')).slice(0, 260) + '</div>';
  if (c.comment || c.note) h += '<div class="tl">' + esc(c.comment || c.note).slice(0, 200) + '</div>';
  return h;
}
document.addEventListener('mouseover', function (e) {
  var r = e.target.closest('.ref[data-st],[data-tip-t]');
  if (!r) { hideTip(); return; }
  var id = r.getAttribute('data-t') || r.getAttribute('data-tip-t'), col = r.getAttribute('data-c') || r.getAttribute('data-tip-c');
  tipEl.innerHTML = colTip(id, col, r.getAttribute('data-st'), r.getAttribute('data-raw'), r.getAttribute('data-sug')) +
    (r.getAttribute('data-after') ? '<div class="tl" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px">Written as <span class="mono">' + esc(r.getAttribute('data-raw')) + '</span> after <span class="mono">' + esc(r.getAttribute('data-after')) + '</span>, which has no such column; bound to ' + (r.getAttribute('data-loose') ? 'a screen table by name (loose)' : 'an earlier table in the cell') + '.</div>' : '');
  tipEl.style.display = 'block';
  var b = r.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  var x = Math.max(8, Math.min(window.innerWidth - tw - 8, b.left)), y = b.bottom + 6;
  if (y + th > window.innerHeight - 8) y = Math.max(8, b.top - th - 6);

});
$('main').addEventListener('scroll', hideTip);
document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
    e.preventDefault();

    $('q').focus(); $('q').select();
  } else if (e.key === 'Escape') { closeDrawer(); hideTip(); $('rail').classList.remove('open'); $('scrim').classList.remove('show'); }
});

/* ======================================================================
   Theme
   ====================================================================== */
function setTheme(t, persist) {
  document.documentElement.setAttribute('data-theme', t);
  if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
(function initTheme() {
  var t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(t, false);

/* ======================================================================
   Debug (#debug=1)
   ====================================================================== */
function debugData() {
  var w = [];
  D.warnings.forEach(function (x) { w.push(x.kind + ' ' + x.file + ':' + x.line + ' ' + x.text); });
  var dup = {};
  D.screens.forEach(function (s) {
    var at = s.file + ':' + s.line + ' ' + s.route;
    if (!s.fields.length) w.push('no-field-rows ' + at);
    if (s.tablesText == null) w.push('no-tables-line ' + at);
    if (!s.purpose) w.push('no-purpose ' + at);
    if (s.statuses == null) w.push('no-statuses ' + at);
    if (s.actions == null) w.push('no-actions ' + at);
    if (s.permission == null) w.push('no-permission ' + at);
    if (s.tablesText != null && !s.roleAll.length) w.push('tables-line-without-tables ' + at);
    s.fieldHeaders.forEach(function (hd) { if (!/^UI field \/ column \| Table\.column \| Notes$/.test(hd)) w.push('field-table-header "' + hd + '" ' + at); });
    if (dup[s.route]) w.push('duplicate-route ' + at); dup[s.route] = 1;
  });
  var perFile = D.files.map(function (f) { return { file: f.file, label: f.label, screens: f.screens.length, fieldRows: f.screens.reduce(function (a, s) { return a + s.fields.length; }, 0) }; });
  var unknownBare = {};
  D.screens.forEach(function (s) { s.fieldRefs.forEach(function (r) { if (r.st === 'unknown') unknownBare[r.raw] = (unknownBare[r.raw] || 0) + 1; }); });
  var topBare = Object.keys(unknownBare).sort(function (a, b) { return unknownBare[b] - unknownBare[a]; }).slice(0, 40).map(function (k) { return k + ' x' + unknownBare[k]; });
  return {
    edition: EDITION, built: BUILT, mdFiles: D.files.length, screens: D.screens.length, fieldRows: AGG.fieldRows,
    ddl: { files: M.files.length, tables: M.order.length, columns: M.colCount, fks: M.fks.length, views: IDX.viewList.length, functions: M.funcs.length, apiFunctions: M.apiCount,
      lookupTypes: M.lookupTypes.length, lookupColumns: M.lookupColList.length, fullOnlyKnown: Object.keys(IDX.full).length, warnings: M.warnings, lookupIssues: M.lookupIssues },
    docFunctions: { named: Object.keys(AGG.fnNamed).length, missing: AGG.fnMissingList.map(function (u) { return u.key + ' x' + u.n; }), screens: AGG.screensWithFns },
    docLookups: { lines: AGG.lookupLines, pairs: AGG.lookupRefs, issues: AGG.lookupIssueList.map(function (u) { return u.key + ' x' + u.n; }) },
    columnRefs: AGG.colRefs, allRefsByStatus: AGG.refCounts,
    coverage: { tablesTouched: AGG.tTouched, tablesTotal: M.order.length, colsMapped: AGG.colsMapped, colsTotal: AGG.colsTotal, bizMapped: AGG.bizMapped, bizTotal: AGG.bizTotal, viewsReferenced: AGG.viewsRefDefined, viewsDefined: AGG.viewsDefined, viewsMissing: Object.keys(AGG.missingViews) },
    unresolvedDistinct: AGG.unresList.length, looseDistinct: AGG.looseList.length,
    topLoose: AGG.looseList.slice(0, 25).map(function (u) { return u.key + ' x' + u.n + ' @' + u.screens[0].route; }),
    topUnresolved: AGG.unresList.slice(0, 40).map(function (u) { return u.key + ' [' + u.st + '] x' + u.n + (u.sug ? ' ~' + u.sug : '') + ' @' + u.screens.slice(0, 3).map(function (s) { return s.route; }).join(','); }),
    topUnknownBare: topBare, perFile: perFile, warnings: w
  };
}
function renderDebug() {
  var d = debugData(), json = JSON.stringify(d, null, 1);
  var pre = $('emap-debug') || document.createElement('pre');
  pre.id = 'emap-debug'; pre.hidden = true; pre.textContent = json; document.body.appendChild(pre);
  var box = document.createElement('section');
  box.className = 'card debug';
  box.innerHTML = '<h3>Debug · parse stats <span class="n">' + d.warnings.length + ' warnings</span></h3><pre>' + esc(json) + '</pre>';
  $('inner').insertBefore(box, $('inner').firstChild);
  if (window.console) console.log('[entity-map] debug', d);
}

/* ======================================================================
   Boot
   ====================================================================== */
try {
  var ddl = blocks('ddl');
  M = parseSql(ddl);
  buildIdx(ddl);
  D = parseDocs(blocks('md'));
  D.byRouteL = {};
  D.screens.forEach(function (s) { if (!D.byRoute[s.route]) D.byRoute[s.route] = s; var rl = s.route.toLowerCase(); if (!D.byRouteL[rl]) D.byRouteL[rl] = s; });
  analyzeAll();
  renderHeader();
  route();
} catch (err) {
  $('inner').innerHTML = '<div class="empty"><div><h3>Could not build the map</h3><pre class="raw" style="text-align:left">' + esc(err && err.stack || err) + '</pre></div></div>';
  if (window.console) console.error(err);
}
window.__emap = { M: function () { return M; }, D: function () { return D; }, AGG: function () { return AGG; }, debug: debugData };
})();
