<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finsoft Schema Explorer</title>
<style>
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface-2:#F7F8F5;--line:#E7EAE5;--ink:#0F1A14;--muted:#6B746E;
  --primary:#1F5F45;--primary-soft:#E6F0EA;--lime:#C6E85B;--on-lime:#0F1A14;
  --edge:#A3ADA6;--zebra:#FAFBF8;--warn:#B45309;--shadow:0 1px 2px rgba(15,26,20,.05),0 10px 30px rgba(15,26,20,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F0D;--surface:#111815;--surface-2:#161F1B;--line:#212C27;--ink:#E8EFEA;--muted:#8A978F;
    --primary:#3DD39B;--primary-soft:#12291F;--lime:#C6E85B;--on-lime:#0F1A14;
    --edge:#4E5D55;--zebra:#131B17;--warn:#F59E0B;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F0D;--surface:#111815;--surface-2:#161F1B;--line:#212C27;--ink:#E8EFEA;--muted:#8A978F;
  --primary:#3DD39B;--primary-soft:#12291F;--lime:#C6E85B;--on-lime:#0F1A14;
  --edge:#4E5D55;--zebra:#131B17;--warn:#F59E0B;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
:root[data-theme="dark"] .logo{color:#0A0F0D}
.brand h1{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:-1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.06em;background:var(--lime);color:var(--on-lime)}
.badge.adhoc{background:var(--primary-soft);color:var(--primary)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.spacer{flex:1}
.search{position:relative;width:300px;max-width:100%}
.search input{width:100%;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px 0 34px;outline:none}
.search input:focus{border-color:var(--primary);background:var(--surface)}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.results{position:absolute;top:42px;right:0;width:min(520px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;padding:6px;z-index:50}
.results.open{display:block}
.res{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;cursor:pointer}
.res.act,.res:hover{background:var(--primary-soft)}
.res .dot{width:8px;height:8px;border-radius:50%;flex:none}
.res .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .kd{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.res .ty{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.btn{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}

/* module strip */
.mods{display:flex;gap:6px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none}
.mod{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;white-space:nowrap}
.mod i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mod span{color:var(--muted);font-weight:500}
.mod.act{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mod.act span{color:inherit;opacity:.7}
.mod.zero{opacity:.55}

/* stage */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.grabbing{cursor:grabbing}
.title{position:absolute;left:16px;top:14px;max-width:min(560px,calc(100% - 32px));pointer-events:none}
.title h2{margin:0;font-size:20px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.title h2 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tools{position:absolute;left:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);z-index:5}
.tools .btn{height:32px;border-radius:10px;font-size:12px}
.tools .btn.icon{width:32px}
.hint{position:absolute;right:16px;bottom:16px;color:var(--muted);font-size:11.5px;pointer-events:none}

/* empty */
#empty{position:absolute;inset:0;display:none;place-items:center;padding:16px;z-index:6}
#empty.show{display:grid}
.drop{max-width:520px;width:100%;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:32px 24px;text-align:center;box-shadow:var(--shadow)}
.drop h3{margin:8px 0 6px;font-size:18px}
.drop p{margin:0 0 16px;color:var(--muted)}
.drop .ic{width:52px;height:52px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:inline-grid;place-items:center}
.dropover{position:fixed;inset:0;background:rgba(31,95,69,.12);border:3px dashed var(--primary);display:none;place-items:center;z-index:100;font-size:18px;font-weight:700;color:var(--primary)}
.dropover.show{display:grid}

/* drawer */
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:460px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  transform:translateX(calc(100% + 24px));transition:transform .22s ease;display:flex;flex-direction:column;z-index:10}
.drawer.open{transform:none}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh .t{flex:1;min-width:0}
.dh .sch{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dh .sch i{width:8px;height:8px;border-radius:50%}
.dh h3{margin:2px 0 0;font-size:18px;font-weight:750;word-break:break-word}
.db{overflow:auto;padding:4px 18px 18px;flex:1}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.sec h4 span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:10.5px;letter-spacing:0}
.desc{white-space:pre-wrap;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
table.cols{width:100%;border-collapse:collapse;font-size:12px}
table.cols th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:-4px;background:var(--surface)}
table.cols td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cols td.n{font-weight:600;overflow-wrap:anywhere}
table.cols td.n small{display:block;font-weight:400;color:var(--muted);word-break:normal}
table.cols td.ty{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:11px;word-break:break-word}
table.cols td.df{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-word;max-width:110px}
.k{display:inline-block;font-size:9.5px;font-weight:800;padding:0 4px;border-radius:5px;margin-right:4px;vertical-align:1px}
.k.pk{background:var(--lime);color:var(--on-lime)}
.k.fk{background:var(--primary-soft);color:var(--primary)}
.k.uq{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.k.lk{background:#FDF3D0;color:#7A5300;border:1px solid #EBCB6B;cursor:pointer;font-family:inherit}
.k.lk:hover{border-color:var(--primary)}
:root[data-theme="dark"] .k.lk{background:#2B2410;color:#F5C451;border-color:#5C4A12}
.lkt{display:block;color:#7A5300;font-size:10.5px;cursor:pointer;background:none;border:0;padding:0;font-family:ui-monospace,Consolas,monospace;text-align:left}
:root[data-theme="dark"] .lkt{color:#F5C451}
.lkt:hover{text-decoration:underline}
.tone{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 2px var(--surface-2)}
table.lv{width:100%;border-collapse:collapse;font-size:12px}
table.lv th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
table.lv td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.lv td.c{font-family:ui-monospace,Consolas,monospace;font-weight:600;word-break:break-word}
table.lv td.p{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.fn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fn .fk{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex:none}
.fn .fk.save{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.fn .fk.get{background:var(--surface);color:var(--primary)}
.fn .fk.posting{background:var(--lime);color:var(--on-lime);border-color:transparent}
.fn .fk.action{background:#FDF3D0;color:#7A5300;border-color:transparent}
:root[data-theme="dark"] .fn .fk.action{background:#2B2410;color:#F5C451}
.fn b{font-family:ui-monospace,Consolas,monospace;font-weight:600;word-break:break-all}
.lchips{display:flex;flex-wrap:wrap;gap:5px}
.lchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:600 11px ui-monospace,Consolas,monospace;color:var(--ink);cursor:pointer}
.lchip:hover{border-color:var(--primary);color:var(--primary)}
.lchip span{color:var(--muted);font-weight:500}
.back{margin-top:12px}
.nn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary)}
.lnk{color:var(--primary);cursor:pointer;font-weight:600;text-decoration:none;border:0;background:none;padding:0;text-align:left;font-size:inherit}
.lnk:hover{text-decoration:underline}
.lnk.missing{color:var(--warn)}
ul.lst{list-style:none;margin:0;padding:0}
ul.lst li{padding:7px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface-2);font-size:12px;word-break:break-word}
ul.lst li small{color:var(--muted);display:block}
.ck{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-word}
.none{color:var(--muted);font-size:12px;font-style:italic}

/* svg styling (also embedded into SVG exports) */
/*SVG_CSS_PLACEHOLDER*/

@media (max-width:860px){
  .stats{display:none}
  .search{order:5;width:100%;flex:1 1 100%}
  .top{gap:8px;padding:8px 12px}
  .mods{padding:6px 12px}
  .btn .lbl{display:none}
  .btn{padding:0 10px}
  .hint{display:none}
}
@media (max-width:720px){
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;height:72vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
  .drawer::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  .title h2{font-size:17px}
  .title p{display:none}
  .tools{left:12px;bottom:12px;right:12px;justify-content:center}
}
</style>
</head>
<body data-edition="__EDITION__" data-built="__BUILT__">
<header class="top">
  <div class="brand">
    <div class="logo">F</div>
    <div><h1>Finsoft Schema Explorer</h1><small>Fundcy &times; Finsoft &middot; PostgreSQL ERD</small></div>
    <span class="badge" id="edition">FULL</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search tables &amp; columns  ( / )" autocomplete="off" spellcheck="false">
    <div class="results" id="results"></div>
  </div>
  <button class="btn" id="btnViews" title="Views"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg><span class="lbl">Views</span> <span id="viewCount"></span></button>
  <button class="btn" id="btnExport" title="Export current view as SVG"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="lbl">Export SVG</span></button>
  <button class="btn" id="btnOpen" title="Open .sql files"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg><span class="lbl">Open SQL</span></button>
  <button class="btn icon" id="btnTheme" title="Toggle light / dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <input type="file" id="file" accept=".sql,text/plain" multiple hidden>
</header>
<nav class="mods" id="mods"></nav>
<main class="stage" id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
  <div class="title" id="title"></div>
  <div class="tools" id="tools">
    <button class="btn" id="btnOverview" title="Back to module overview">Overview</button>
    <button class="btn icon" id="btnZoomOut" title="Zoom out">&minus;</button>
    <button class="btn icon" id="btnZoomIn" title="Zoom in">+</button>
    <button class="btn" id="btnFit" title="Fit to screen">Fit</button>
    <button class="btn" id="btnKeys" title="Show keys only / all columns">Keys only</button>
    <button class="btn" id="btnTenant" title="Show tenantId links to Platform.Tenants">Tenant links</button>
  </div>
  <div class="hint">Wheel to zoom &middot; drag to pan &middot; click a table for details</div>
  <div class="empty" id="empty">
    <div class="drop">
      <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
      <h3>No DDL embedded</h3>
      <p>Drop one or more <b>.sql</b> files anywhere on this page, or rebuild with <span class="mono">powershell -File build-erd.ps1</span>.</p>
      <button class="btn on" id="btnPick">Choose .sql files</button>
    </div>
  </div>
  <aside class="drawer" id="drawer"><div class="dh"><div class="t" id="dTitle"></div><button class="btn icon" id="dClose" title="Close">&times;</button></div><div class="db" id="dBody"></div></aside>
</main>
<div class="dropover" id="dropover">Drop .sql files to view them</div>

<script>
(function () {
'use strict';

/* ======================================================================
   Constants
   ====================================================================== */
var MODULES = [
  ['Platform', 'SaaS console', '#64748B'], ['Company', 'Company & users', '#15803D'], ['Accounting', 'Accounting', '#2563EB'],
  ['BankCash', 'Bank & cash', '#0891B2'], ['FixedAssets', 'Fixed assets', '#7C3AED'], ['Tax', 'Tax', '#DB2777'],
  ['Sales', 'Sales & receivables', '#EA580C'], ['Purchases', 'Purchases & payables', '#CA8A04'], ['Inventory', 'Inventory', '#65A30D'],

  ['EmployeeSelfService', 'Employee self-service', '#0F766E'], ['Reports', 'Report studio', '#78716C'],
  ['Lookups', 'Lookup lists (utility)', '#B08900']
];
var UTILITY_MODS = { Lookups: 1 };
var MOD = {};
MODULES.forEach(function (m, i) { MOD[m[0]] = { key: m[0], label: m[1], color: m[2], i: i }; });
function modKey(s) {
  // case-insensitive module name -> key
  if (MOD[s]) return s;
  var l = String(s || '').toLowerCase();
  for (var k in MOD) if (k.toLowerCase() === l) return k;
  return s;
}
var TONES = { good: '#16A34A', warn: '#D97706', danger: '#DC2626', info: '#2563EB', neutral: '#94A3B8', violet: '#7C3AED' };
function toneColor(t) { return TONES[t] || TONES.neutral; }
var W = 264, HEAD = 48, ROW = 21, PADB = 8, GAPX = 220, GAPY = 26;
var FONT = "'Plus Jakarta Sans',Inter,'Segoe UI',system-ui,sans-serif";
var THEME_KEY = 'finsoft-erd-theme';

var SVG_CSS = [
  'text{font-family:' + FONT + '}',
  '.c-body{fill:var(--surface);stroke:var(--line);stroke-width:1}',
  '.c-head{fill:var(--surface-2)}',
  '.c-sep{stroke:var(--line);stroke-width:1}',
  '.c-title{font-size:13px;font-weight:700;fill:var(--ink)}',
  '.c-pill{fill:var(--surface);stroke:var(--line)}',
  '.c-pilltx{font-size:9.5px;font-weight:700;fill:var(--muted)}',
  '.c-pk .c-pill{fill:var(--lime);stroke:var(--lime)}.c-pk .c-pilltx{fill:var(--on-lime)}',
  '.c-fk .c-pill{fill:var(--primary-soft);stroke:var(--primary-soft)}.c-fk .c-pilltx{fill:var(--primary)}',
  '.c-zebra{fill:var(--zebra)}',
  '.c-col{font-size:11.5px;fill:var(--ink)}',
  '.c-col.k{font-weight:700}',
  '.c-type{font-size:10.5px;fill:var(--muted)}',
  '.c-nn{fill:var(--primary)}',
  '.c-key{fill:none;stroke:#8DAA2B;stroke-width:1.6}',
  '.c-lnk{fill:none;stroke:var(--primary);stroke-width:1.4}',
  '.c-more{font-size:10.5px;fill:var(--muted);font-style:italic}',
  '.c-lk{cursor:pointer}',
  '.c-lk rect{fill:#FDF3D0;stroke:#EBCB6B}',
  '.c-lk text{font-size:8.5px;font-weight:800;fill:#7A5300}',
  '.c-lk:hover rect{stroke:var(--primary)}',
  '.c-lkty{font-size:10.5px;fill:#9A6B00}',
  '.card{cursor:pointer}',
  '.card:hover .c-body{stroke:var(--primary)}',
  '.card.sel .c-body{stroke:var(--primary);stroke-width:2.5}',
  '.card.nb .c-body{stroke:var(--primary);stroke-width:1.5}',
  '.edge{fill:none;stroke:var(--edge);stroke-width:1.4}',

  M.views.forEach(function (v) { if (!M.idL[v.id.toLowerCase()]) M.idL[v.id.toLowerCase()] = v.id; });
  M.fks.forEach(function (fk, i) {

function overviewLayout() {
  var cx = 560, cy = 400, pos = {};
  pos.Platform = [470, 400]; pos.Company = [650, 400];
  pos.Lookups = [1062, 712];   // utility module: small bubble in the corner, off the ring
  var ring = ['Accounting', 'BankCash', 'Tax', 'Sales', 'Distribution', 'Inventory', 'Purchases', 'FixedAssets', 'Reports', 'EmployeeSelfService', 'Payroll', 'HumanResources'];
  MODULES.forEach(function (m) { if (!pos[m[0]] && ring.indexOf(m[0]) < 0) ring.push(m[0]); });
  ring.forEach(function (k, i) {
    var a = -Math.PI / 2 + (i / ring.length) * Math.PI * 2;
    pos[k] = [cx + Math.cos(a) * 440, cy + Math.sin(a) * 300];
  });
  return { pos: pos, cx: cx, cy: cy };
}
function renderOverview() {
  var M = state.model, L = overviewLayout(), pos = L.pos;
  var R = {};

  M.fks.forEach(function (fk) {
    if (!fk.cross) return;
    if (fk.isTenant && !state.showTenant) return;
    var a = modOf(fk.from), b = modOf(fk.to);
    if (!pos[a] || !pos[b]) return;
    var k = a < b ? a + '|' + b : b + '|' + a;
    w[k] = (w[k] || 0) + 1;
  });

  Object.keys(w).forEach(function (k) {
    var ab = k.split('|'), p1 = pos[ab[0]], p2 = pos[ab[1]], n = w[k];
    var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    var qx = mx + (L.cx - mx) * 0.28, qy = my + (L.cy - my) * 0.28;
    var sw = Math.min(14, 1.2 + 1.5 * Math.sqrt(n));
    edges += '<g class="ov-edge-g" data-a="' + ab[0] + '" data-b="' + ab[1] + '"><path class="ov-edge" stroke-width="' + sw.toFixed(1) + '" stroke-opacity=".55" d="M' + p1[0] + ' ' + p1[1] + ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) + ' ' + p2[0] + ' ' + p2[1] + '"/>';
    var lx = 0.25 * p1[0] + 0.5 * qx + 0.25 * p2[0], ly = 0.25 * p1[1] + 0.5 * qy + 0.25 * p2[1];

    labels += '<g class="ov-lbl ov-edge-g" data-a="' + ab[0] + '" data-b="' + ab[1] + '"><rect x="' + (lx - tw / 2).toFixed(1) + '" y="' + (ly - 9).toFixed(1) + '" width="' + tw + '" height="18" rx="9"/><text x="' + lx.toFixed(1) + '" y="' + (ly + 3.8).toFixed(1) + '" text-anchor="middle">' + n + '</text></g>';
    edges += '</g>';
  });

      (n ? '<circle r="' + r + '" fill="' + m[2] + '"/>'

      '<text class="bub-name" text-anchor="middle" y="' + (r > 34 ? -1 : 4) + '" style="font-size:' + Math.min(14, (2 * r - 10) / (k.length * 0.62)).toFixed(1) + 'px">' + esc(k) + '</text>' +
      (r > 34 ? '<text class="bub-cnt" text-anchor="middle" y="15">' + n + ' tables</text>'

  state.bounds = { x: 0, y: 30, w: 1120, h: 750 };
  $('title').innerHTML = '<h2>Module overview</h2><p>' + MODULES.filter(function (m) { return (M.bySchema[m[0]] || []).length; }).length +
    ' of ' + MODULES.length + ' modules have tables. Bubble size = table count; edge weight = cross-module FKs' + (state.showTenant ? ' (incl. tenantId)' : '') + '. Click a bubble.</p>';
}

var index = [];
function buildIndex() {
  index = [];
  var M = state.model;
  M.order.forEach(function (id) {
    var t = M.tables[id];
    index.push({ k: 'table', id: id, label: id, l: id.toLowerCase(), extra: t.cols.length + ' cols' });
    t.cols.forEach(function (c) { index.push({ k: 'column', id: id, col: c.name, label: id + '.' + c.name, l: (id + '.' + c.name).toLowerCase(), extra: c.lookup ? 'list ' + c.lookup.type : c.type }); });
  });
  M.funcs.forEach(function (f) { if (f.api) index.push({ k: 'function', id: f.table || f.id, fn: f.id, label: f.id, l: f.id.toLowerCase(), extra: f.table ? '→ ' + f.table : f.returns }); });
  M.lookupTypes.forEach(function (ty) { index.push({ k: 'list', id: 'Lookups.' + ty, lookup: ty, label: ty, l: ('lookups.' + ty).toLowerCase(), extra: M.lookups[ty].length + ' values' }); });
}
function score(q, s) {
  var i = s.indexOf(q);
  if (i >= 0) {
    var sc = 1000 - i * 2 - (s.length - q.length) * 0.5;
    if (i === 0 || /[._]/.test(s[i - 1])) sc += 200;
    if (i + q.length === s.length) sc += 120;
    return sc;
  }
  var si = 0, last = -2, total = 0;
  for (var k = 0; k < q.length; k++) {
    var f = s.indexOf(q[k], si); if (f < 0) return -1;
    total += f === last + 1 ? 8 : (/[._]/.test(s[f - 1] || '.') ? 5 : 1);
    last = f; si = f + 1;
  }
  return total * 4 - s.length * 0.3;
}
var results = [], act = 0, sTimer = null;
function doSearch() {
  var q = $('q').value.trim().toLowerCase(), box = $('results');
  if (!q) { box.classList.remove('open'); results = []; return; }
  var terms = q.split(/\s+/), out = [];
  for (var i = 0; i < index.length; i++) {
    var e = index[i], tot = 0;
    for (var j = 0; j < terms.length; j++) { var s = score(terms[j], e.l); if (s < 0) { tot = -1; break; } tot += s; }
    if (tot < 0) continue;
    if (e.k === 'table') tot += 60;
    out.push({ e: e, s: tot });
  }
  out.sort(function (a, b) { return b.s - a.s; });
  results = out.slice(0, 40).map(function (x) { return x.e; }); act = 0;
  box.innerHTML = results.length ? results.map(function (e, i) {
    return '<div class="res' + (i === act ? ' act' : '') + '" data-i="' + i + '"><span class="dot" style="background:' + modColor(modOf(e.id)) + '"></span><span class="nm">' + esc(e.label) + '</span><span class="ty">' + esc(e.extra) + '</span><span class="kd">' + e.k + '</span></div>';
  }).join('') : '<div class="res"><span class="none">No matches</span></div>';

}
function pick(i) {

  if (e.k === 'function' && !state.model.tables[e.id]) { go({ view: 'module', module: modOf(e.fn) }); return; }
  openTable(e.id, true);
}

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

};

function readFiles(list) {
  var fs = Array.prototype.filter.call(list, function (f) { return /\.(sql|txt)$/i.test(f.name) || !f.type || f.type.indexOf('text') === 0; });
  if (!fs.length) return;
  Promise.all(fs.map(function (f) {
    return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res({ file: f.name, text: String(r.result) }); }; r.onerror = function () { res({ file: f.name, text: '' }); }; r.readAsText(f); });
  })).then(function (files) {
    files.sort(function (a, b) { return a.file < b.file ? -1 : a.file > b.file ? 1 : 0; });
    setModel(files, true);
    var mods = Object.keys(state.model.bySchema);
    if (mods.length === 1) go({ view: 'module', module: mods[0] }); else go({ view: 'overview' });
  });
}
$('btnOpen').onclick = $('btnPick').onclick = function () { $('file').click(); };
$('file').onchange = function () { readFiles(this.files); this.value = ''; };
var dragDepth = 0;
window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { dragDepth++; $('dropover').classList.add('show'); } });
window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropover').classList.remove('show'); });
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); dragDepth = 0; $('dropover').classList.remove('show'); if (e.dataTransfer && e.dataTransfer.files.length) readFiles(e.dataTransfer.files); });
window.addEventListener('resize', function () { if (state.view === 'overview') fitView(); });

/* ======================================================================
   Boot
   ====================================================================== */
var st = document.createElement('style'); st.textContent = SVG_CSS; document.head.appendChild(st);
state.embedded = loadEmbedded();
setModel(state.embedded, false);
readHash();
window.__erd = state;
})();
</script>
</body>
