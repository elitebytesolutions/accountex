services:
  db:
    image: postgres:18-alpine
    container_name: accountex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: accountex
      POSTGRES_PASSWORD: accountex
      POSTGRES_DB: accountex
    ports:
      - "5440:5432"
    volumes:
      - accountex-db:/var/lib/postgresql

volumes:
  accountex-db:
